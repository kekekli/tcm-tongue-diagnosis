<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分析历史 - 中医舌诊助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }

        .header {
            background: linear-gradient(135deg, #43cea2 0%, #185a9d 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .content {
            padding: 30px;
        }

        .filter-bar {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .filter-group label {
            font-size: 14px;
            color: #666;
        }

        .filter-group select,
        .filter-group input {
            padding: 8px 12px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 14px;
            background: white;
        }

        .filter-group select:focus,
        .filter-group input:focus {
            outline: none;
            border-color: #43cea2;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #43cea2 0%, #185a9d 100%);
            color: white;
        }

        .btn-secondary {
            background: #f8f9fa;
            color: #333;
            border: 2px solid #e9ecef;
        }

        .btn:hover {
            transform: translateY(-1px);
        }

        .history-list {
            display: grid;
            gap: 20px;
        }

        .history-item {
            background: white;
            border: 2px solid #f1f3f4;
            border-radius: 15px;
            padding: 20px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .history-item:hover {
            border-color: #43cea2;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(67, 206, 162, 0.1);
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .item-date {
            font-size: 16px;
            font-weight: 600;
            color: #333;
        }

        .item-time {
            font-size: 14px;
            color: #666;
            margin-top: 5px;
        }

        .item-actions {
            display: flex;
            gap: 10px;
        }

        .action-btn {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .action-btn.view {
            background: #e8f5e8;
            color: #28a745;
        }

        .action-btn.delete {
            background: #ffeaea;
            color: #dc3545;
        }

        .action-btn:hover {
            opacity: 0.8;
        }

        .item-content {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 20px;
            align-items: center;
        }

        .item-image {
            width: 80px;
            height: 80px;
            border-radius: 10px;
            object-fit: cover;
            border: 2px solid #f1f3f4;
        }

        .item-details {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
        }

        .detail-item {
            text-align: center;
        }

        .detail-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
        }

        .detail-value {
            font-size: 14px;
            font-weight: 600;
            color: #333;
        }

        .confidence-bar {
            width: 100%;
            height: 4px;
            background: #e9ecef;
            border-radius: 2px;
            overflow: hidden;
            margin-top: 5px;
        }

        .confidence-fill {
            height: 100%;
            background: linear-gradient(135deg, #43cea2 0%, #185a9d 100%);
            transition: width 0.3s ease;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .empty-state .icon {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-state h3 {
            font-size: 18px;
            margin-bottom: 10px;
            color: #333;
        }

        .loading {
            text-align: center;
            padding: 40px;
        }

        .loading-spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #43cea2;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 30px;
        }

        .pagination button {
            padding: 8px 12px;
            border: 2px solid #e9ecef;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .pagination button:hover:not(:disabled) {
            border-color: #43cea2;
            background: #f8f9fa;
        }

        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .pagination .current {
            background: #43cea2;
            color: white;
            border-color: #43cea2;
        }

        .back-link {
            text-align: center;
            margin-top: 30px;
        }

        .back-link a {
            color: #666;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link a:hover {
            color: #43cea2;
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 4px solid #c33;
        }

        @media (max-width: 768px) {
            .container {
                margin: 10px;
            }
            
            .content {
                padding: 20px;
            }
            
            .filter-bar {
                flex-direction: column;
                align-items: stretch;
            }
            
            .filter-group {
                justify-content: space-between;
            }
            
            .item-content {
                grid-template-columns: 1fr;
                gap: 15px;
            }
            
            .item-details {
                grid-template-columns: 1fr;
                gap: 10px;
            }
            
            .item-header {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 我的分析历史</h1>
            <p>查看您的所有舌诊分析记录</p>
        </div>

        <div class="content">
            <!-- 筛选栏 -->
            <div class="filter-bar">
                <div class="filter-group">
                    <label>体质类型：</label>
                    <select id="constitutionFilter">
                        <option value="">全部</option>
                        <option value="湿热质">湿热质</option>
                        <option value="气虚质">气虚质</option>
                        <option value="阳虚质">阳虚质</option>
                        <option value="阴虚质">阴虚质</option>
                        <option value="平和质">平和质</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>时间范围：</label>
                    <select id="timeFilter">
                        <option value="">全部</option>
                        <option value="today">今天</option>
                        <option value="week">近一周</option>
                        <option value="month">近一个月</option>
                    </select>
                </div>
                <button class="btn btn-primary" onclick="applyFilters()">筛选</button>
                <button class="btn btn-secondary" onclick="resetFilters()">重置</button>
            </div>

            <!-- 错误消息 -->
            <div id="errorMessage"></div>

            <!-- 加载状态 -->
            <div id="loadingState" class="loading" style="display: none;">
                <div class="loading-spinner"></div>
                <div>正在加载分析历史...</div>
            </div>

            <!-- 历史记录列表 -->
            <div id="historyList" class="history-list">
                <!-- 动态加载的内容 -->
            </div>

            <!-- 空状态 -->
            <div id="emptyState" class="empty-state" style="display: none;">
                <div class="icon">📋</div>
                <h3>暂无分析记录</h3>
                <p>您还没有进行过舌诊分析</p>
                <div style="margin-top: 20px;">
                    <a href="/upload.html" class="btn btn-primary">开始第一次分析</a>
                </div>
            </div>

            <!-- 分页 -->
            <div id="pagination" class="pagination" style="display: none;">
                <button onclick="goToPage(currentPage - 1)" id="prevBtn">上一页</button>
                <span id="pageInfo">第 1 页，共 1 页</span>
                <button onclick="goToPage(currentPage + 1)" id="nextBtn">下一页</button>
            </div>

            <div class="back-link">
                <a href="/">← 返回首页</a>
            </div>
        </div>
    </div>

    <script>
        let currentPage = 1;
        let totalPages = 1;
        let allHistories = [];
        let filteredHistories = [];

        // 页面加载时初始化
        window.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('authToken');
            if (!token) {
                showError('请先登录再查看分析历史');
                setTimeout(() => {
                    window.location.href = '/auth.html';
                }, 2000);
                return;
            }
            
            loadHistories();
        });

        // 加载历史记录
        async function loadHistories() {
            const token = localStorage.getItem('authToken');
            const userInfo = localStorage.getItem('userInfo');
            
            if (!token || !userInfo) {
                showError('用户信息不完整，请重新登录');
                return;
            }

            const user = JSON.parse(userInfo);
            showLoading(true);

            try {
                const response = await fetch(`/api/analysis/history/${user.id}?limit=50&offset=0`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                const result = await response.json();

                if (result.success) {
                    allHistories = result.data;
                    filteredHistories = [...allHistories];
                    renderHistories();
                } else {
                    showError(result.message || '加载历史记录失败');
                }
            } catch (error) {
                console.error('加载历史记录错误:', error);
                showError('网络错误，请重试');
            } finally {
                showLoading(false);
            }
        }

        // 渲染历史记录
        function renderHistories() {
            const historyList = document.getElementById('historyList');
            const emptyState = document.getElementById('emptyState');
            const pagination = document.getElementById('pagination');

            if (filteredHistories.length === 0) {
                historyList.style.display = 'none';
                emptyState.style.display = 'block';
                pagination.style.display = 'none';
                return;
            }

            // 分页处理
            const itemsPerPage = 10;
            totalPages = Math.ceil(filteredHistories.length / itemsPerPage);
            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const pageHistories = filteredHistories.slice(startIndex, endIndex);

            historyList.innerHTML = '';
            
            pageHistories.forEach(history => {
                const historyItem = createHistoryItem(history);
                historyList.appendChild(historyItem);
            });

            historyList.style.display = 'grid';
            emptyState.style.display = 'none';
            updatePagination();
        }

        // 创建历史记录项
        function createHistoryItem(history) {
            const item = document.createElement('div');
            item.className = 'history-item';
            
            const date = new Date(history.created_at);
            const formattedDate = date.toLocaleDateString('zh-CN');
            const formattedTime = date.toLocaleTimeString('zh-CN');
            
            const confidence = (history.confidence_score * 100).toFixed(0);
            
            item.innerHTML = `
                <div class="item-header">
                    <div>
                        <div class="item-date">${formattedDate}</div>
                        <div class="item-time">${formattedTime}</div>
                    </div>
                    <div class="item-actions">
                        <button class="action-btn view" onclick="viewDetails(${history.id})">查看详情</button>
                        <button class="action-btn delete" onclick="deleteHistory(${history.id})">删除</button>
                    </div>
                </div>
                <div class="item-content">
                    <img src="/uploads/images/default-tongue.jpg" 
                         alt="舌诊图片" 
                         class="item-image"
                         onerror="this.src='/uploads/images/placeholder.jpg'">
                    <div class="item-details">
                        <div class="detail-item">
                            <div class="detail-label">舌质颜色</div>
                            <div class="detail-value">${history.tongue_color || '未知'}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">舌苔类型</div>
                            <div class="detail-value">${history.coating_type || '未知'}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">体质类型</div>
                            <div class="detail-value">${history.constitution_type || '未知'}</div>
                        </div>
                    </div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">置信度</div>
                    <div class="detail-value">${confidence}%</div>
                    <div class="confidence-bar">
                        <div class="confidence-fill" style="width: ${confidence}%"></div>
                    </div>
                </div>
            `;
            
            return item;
        }

        // 应用筛选
        function applyFilters() {
            const constitutionFilter = document.getElementById('constitutionFilter').value;
            const timeFilter = document.getElementById('timeFilter').value;
            
            filteredHistories = allHistories.filter(history => {
                // 体质类型筛选
                if (constitutionFilter && history.constitution_type !== constitutionFilter) {
                    return false;
                }
                
                // 时间筛选
                if (timeFilter) {
                    const historyDate = new Date(history.created_at);
                    const now = new Date();
                    const diffTime = now.getTime() - historyDate.getTime();
                    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                    
                    switch (timeFilter) {
                        case 'today':
                            if (diffDays > 1) return false;
                            break;
                        case 'week':
                            if (diffDays > 7) return false;
                            break;
                        case 'month':
                            if (diffDays > 30) return false;
                            break;
                    }
                }
                
                return true;
            });
            
            currentPage = 1;
            renderHistories();
        }

        // 重置筛选
        function resetFilters() {
            document.getElementById('constitutionFilter').value = '';
            document.getElementById('timeFilter').value = '';
            filteredHistories = [...allHistories];
            currentPage = 1;
            renderHistories();
        }

        // 查看详情
        function viewDetails(historyId) {
            alert(`查看分析详情 ID: ${historyId}\n（详情页面开发中）`);
        }

        // 删除历史记录
        async function deleteHistory(historyId) {
            if (!confirm('确定要删除这条分析记录吗？')) {
                return;
            }
            
            // TODO: 实现删除API
            alert('删除功能开发中...');
        }

        // 分页相关
        function updatePagination() {
            const pagination = document.getElementById('pagination');
            const pageInfo = document.getElementById('pageInfo');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            
            if (totalPages <= 1) {
                pagination.style.display = 'none';
                return;
            }
            
            pagination.style.display = 'flex';
            pageInfo.textContent = `第 ${currentPage} 页，共 ${totalPages} 页`;
            prevBtn.disabled = currentPage <= 1;
            nextBtn.disabled = currentPage >= totalPages;
        }

        function goToPage(page) {
            if (page < 1 || page > totalPages) return;
            currentPage = page;
            renderHistories();
        }

        // 显示加载状态
        function showLoading(show) {
            const loadingState = document.getElementById('loadingState');
            const historyList = document.getElementById('historyList');
            const emptyState = document.getElementById('emptyState');
            
            if (show) {
                loadingState.style.display = 'block';
                historyList.style.display = 'none';
                emptyState.style.display = 'none';
            } else {
                loadingState.style.display = 'none';
            }
        }

        // 显示错误消息
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.innerHTML = `<div class="error-message">${message}</div>`;
            setTimeout(() => {
                errorDiv.innerHTML = '';
            }, 5000);
        }
    </script>
</body>
</html>
