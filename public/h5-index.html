<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中医舌诊助手 - H5版本导航</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            width: 100%;
            background: white;
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
            text-align: center;
        }

        .logo {
            font-size: 80px;
            margin-bottom: 20px;
        }

        .title {
            font-size: 32px;
            font-weight: 700;
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 18px;
            color: #666;
            margin-bottom: 40px;
        }

        .version-grid {
            display: grid;
            gap: 20px;
            margin-bottom: 30px;
        }

        .version-card {
            background: linear-gradient(135deg, #f8f9ff, #e8f0fe);
            border-radius: 16px;
            padding: 25px 20px;
            text-decoration: none;
            color: inherit;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            position: relative;
            overflow: hidden;
        }

        .version-card:hover {
            transform: translateY(-5px);
            border-color: #667eea;
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.2);
        }

        .version-icon {
            font-size: 48px;
            margin-bottom: 15px;
            display: block;
        }

        .version-title {
            font-size: 22px;
            font-weight: 700;
            color: #333;
            margin-bottom: 8px;
        }

        .version-desc {
            font-size: 16px;
            color: #666;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .version-features {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }

        .feature-tag {
            background: rgba(102, 126, 234, 0.1);
            color: #667eea;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        .demo-section {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid #eee;
        }

        .demo-title {
            font-size: 20px;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
        }

        .demo-links {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .demo-link {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
            padding: 8px 16px;
            border: 2px solid #667eea;
            border-radius: 25px;
            transition: all 0.3s ease;
        }

        .demo-link:hover {
            background: #667eea;
            color: white;
        }

        .info-box {
            background: #e8f5e8;
            border: 1px solid #c8e6c8;
            color: #2e7d2e;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            font-size: 14px;
            line-height: 1.5;
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }
            
            .title {
                font-size: 28px;
            }
            
            .subtitle {
                font-size: 16px;
            }
            
            .version-card {
                padding: 20px 15px;
            }
            
            .version-title {
                font-size: 20px;
            }
            
            .version-desc {
                font-size: 14px;
            }
            
            .demo-links {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🔍</div>
        <h1 class="title">中医舌诊助手</h1>
        <p class="subtitle">AI驱动的专业舌诊分析系统</p>

        <div class="version-grid">
            <a href="tongue-h5.html" class="version-card">
                <span class="version-icon">📱</span>
                <div class="version-title">基础版</div>
                <div class="version-desc">简洁易用的图片上传分析版本</div>
                <div class="version-features">
                    <span class="feature-tag">文件上传</span>
                    <span class="feature-tag">拖拽上传</span>
                    <span class="feature-tag">AI分析</span>
                    <span class="feature-tag">产品推荐</span>
                </div>
            </a>

            <a href="tongue-camera.html" class="version-card">
                <span class="version-icon">📷</span>
                <div class="version-title">相机版</div>
                <div class="version-desc">支持实时拍照和文件上传的完整版本</div>
                <div class="version-features">
                    <span class="feature-tag">实时拍照</span>
                    <span class="feature-tag">相机预览</span>
                    <span class="feature-tag">拍照指导</span>
                    <span class="feature-tag">完整功能</span>
                </div>
            </a>
        </div>

        <div class="demo-section">
            <div class="demo-title">🔗 其他版本</div>
            <div class="demo-links">
                <a href="index.html" class="demo-link">Web版首页</a>
                <a href="upload.html" class="demo-link">上传页面</a>
                <a href="/api/products" class="demo-link">API数据</a>
            </div>
        </div>

        <div class="info-box">
            <strong>💡 使用提示：</strong><br>
            • 建议使用手机浏览器访问相机版<br>
            • 确保光线充足，舌头清晰可见<br>
            • 分析结果仅供参考，请咨询专业医师<br>
            • 支持JPG、PNG格式，最大5MB
        </div>
    </div>

    <script>
        // 检测设备类型
        function detectDevice() {
            const userAgent = navigator.userAgent;
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(userAgent);
            
            if (isMobile) {
                console.log('检测到移动设备，推荐使用相机版');
                // 可以在这里添加推荐提示
            } else {
                console.log('检测到桌面设备，推荐使用基础版');
            }
        }

        // 页面加载完成
        document.addEventListener('DOMContentLoaded', () => {
            detectDevice();
            console.log('中医舌诊H5导航页面已加载');
        });
    </script>
</body>
</html>
