<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中医舌诊智能助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
            text-align: center;
        }
        
        .logo {
            font-size: 48px;
            margin-bottom: 20px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 15px;
            font-size: 28px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            cursor: pointer;
            margin: 8px;
            transition: transform 0.2s, box-shadow 0.2s;
            min-width: 160px;
            display: inline-block;
            text-decoration: none;
        }
        
        .btn-large {
            padding: 20px 40px;
            font-size: 20px;
            margin: 15px 0;
            background: linear-gradient(135deg, #43cea2 0%, #185a9d 100%);
            min-width: 250px;
        }
        
        .btn-secondary {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            color: #333;
            border: 2px solid #dee2e6;
        }
        
        .btn-admin {
            background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);
            font-size: 14px;
            padding: 10px 20px;
            margin: 5px;
            min-width: 120px;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        
        .user-status {
            background: linear-gradient(135deg, #43cea2 0%, #185a9d 100%);
            color: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 25px;
            display: none;
            text-align: left;
        }
        
        .user-status.show {
            display: block;
        }
        
        .user-info {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }
        
        .user-left {
            display: flex;
            align-items: center;
        }
        
        .user-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-right: 15px;
        }
        
        .user-details h3 {
            margin: 0 0 5px 0;
            font-size: 18px;
        }
        
        .user-details p {
            margin: 0;
            font-size: 14px;
            opacity: 0.9;
        }
        
        .user-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 15px;
        }
        
        .stat-item {
            background: rgba(255,255,255,0.1);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .stat-label {
            font-size: 12px;
            opacity: 0.8;
        }
        
        .logout-btn {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
        }
        
        .main-actions {
            margin: 30px 0;
        }
        
        .secondary-actions {
            margin: 20px 0;
        }
        
        .admin-actions {
            margin-top: 30px;
            padding: 20px;
            background: #fff5f5;
            border-radius: 10px;
            border-left: 4px solid #dc3545;
            display: none;
        }
        
        .admin-actions.show {
            display: block;
        }
        
        .action-group {
            margin-bottom: 15px;
        }
        
        .action-group h4 {
            margin: 0 0 10px 0;
            font-size: 14px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .guest-actions {
            text-align: center;
            margin: 30px 0;
        }
        
        .status {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 4px solid #28a745;
            text-align: left;
        }
        

        @media (max-width: 480px) {
            .container {
                margin: 10px;
                padding: 20px;
            }
            
            .btn {
                display: block;
                margin: 10px 0;
                min-width: auto;
            }
            
            .user-info {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .logout-btn {
                margin-top: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🔍👅</div>
        <h1>中医舌诊智能助手</h1>
        <p class="subtitle">基于AI的中医舌诊分析系统</p>
        
        <!-- 用户状态显示 -->
        <div id="userStatus" class="user-status">
            <div class="user-info">
                <div class="user-left">
                    <div class="user-avatar">👤</div>
                    <div class="user-details">
                        <h3 id="userName">用户名</h3>
                        <p id="userPhone">手机号</p>
                    </div>
                </div>
                <button class="logout-btn" onclick="logout()">退出登录</button>
            </div>
            <div class="user-stats">
                <div class="stat-item">
                    <div class="stat-value" id="analysisCount">0</div>
                    <div class="stat-label">分析次数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="constitutionType">未知</div>
                    <div class="stat-label">体质类型</div>
                </div>
            </div>
        </div>

        <!-- 游客界面 -->
        <div id="guestInterface" class="guest-actions">
            <a href="/auth.html" class="btn btn-large">👤 登录/注册</a>
            <div style="margin: 20px 0;">
                <button class="btn btn-secondary" onclick="testProducts()">🛒 查看产品推荐</button>
            </div>
        </div>

        <!-- 用户界面 -->
        <div id="userInterface" style="display: none;">
            <!-- 主要功能 -->
            <div class="main-actions">
                <a href="/upload.html" class="btn btn-large">📸 开始舌诊分析</a>
            </div>

            <!-- 次要功能 -->
            <div class="secondary-actions">
                <a href="/history.html" class="btn">📊 我的分析历史</a>
                <button class="btn" onclick="testProducts()">🛒 查看产品推荐</button>
                <a href="/profile.html" class="btn">⚙️ 个人设置</a>
            </div>
        </div>

        <!-- 管理员界面 -->
        <div id="adminActions" class="admin-actions">
            <div class="action-group">
                <h4>🔧 系统管理</h4>
                <button class="btn btn-admin" onclick="checkHealth()">📊 健康检查</button>
                <button class="btn btn-admin" onclick="testAuthenticatedAPI()">🔐 测试认证API</button>
                <a href="/admin.html" class="btn btn-admin">👥 用户管理</a>
            </div>
            <div class="action-group">
                <h4>📈 数据统计</h4>
                <button class="btn btn-admin" onclick="showStats()">📈 系统统计</button>
                <button class="btn btn-admin" onclick="exportData()">📋 导出数据</button>
                <button class="btn btn-admin" onclick="toggleDebugMode()">🐛 调试模式</button>
            </div>
        </div>

        <!-- 管理员调试面板 -->
        <div id="debugPanel" class="admin-actions" style="background: #f8f9fa; border-left-color: #6c757d;">
            <div class="action-group">
                <h4>🐛 开发者调试</h4>
                <button class="btn btn-admin" onclick="testAnalysis()">🔍 测试舌诊分析</button>
                <button class="btn btn-admin" onclick="clearDebugLog()">🗑️ 清空日志</button>
            </div>
            <div style="margin-top: 15px;">
                <h5 style="margin: 0 0 10px 0; font-size: 12px; color: #666;">实时日志</h5>
                <div id="debugLog" style="background: #fff; border: 1px solid #dee2e6; border-radius: 8px; padding: 10px; max-height: 200px; overflow-y: auto; font-family: monospace; font-size: 11px; white-space: pre-wrap;"></div>
            </div>
        </div>

        <div class="status">
            <h3>🎯 核心功能</h3>
            <p>✅ 舌象拍照分析</p>
            <p>✅ AI智能识别</p>
            <p>✅ 个性化调理建议</p>
            <p>✅ 产品推荐系统</p>
            <p>✅ 用户数据管理</p>
        </div>
    </div>

    <script>
        let debugMode = false;
        
        function log(message) {
            console.log('[TCM] ' + message);
            
            // 如果是调试模式且是管理员，显示在调试面板
            if (debugMode) {
                const debugLog = document.getElementById('debugLog');
                if (debugLog) {
                    debugLog.textContent += new Date().toLocaleTimeString() + ': ' + message + '\n';
                    debugLog.scrollTop = debugLog.scrollHeight;
                }
            }
        }
        
        // 切换调试模式
        function toggleDebugMode() {
            debugMode = !debugMode;
            const debugPanel = document.getElementById('debugPanel');
            if (debugMode) {
                debugPanel.classList.add('show');
                log('🐛 调试模式已开启');
            } else {
                debugPanel.classList.remove('show');
                console.log('[TCM] 🐛 调试模式已关闭');
            }
        }
        
        // 清空调试日志
        function clearDebugLog() {
            const debugLog = document.getElementById('debugLog');
            if (debugLog) {
                debugLog.textContent = '';
                log('🗑️ 调试日志已清空');
            }
        }
        
        // 检查本地存储
        function checkLocalStorage() {
            const token = localStorage.getItem('authToken');
            const userInfo = localStorage.getItem('userInfo');
            log('检查本地存储: ' + (userInfo ? '已登录' : '未登录'));
        }
        
        // 更新用户状态显示
        function updateUserInterface() {
            const token = localStorage.getItem('authToken');
            const userInfo = localStorage.getItem('userInfo');
            
            const userStatus = document.getElementById('userStatus');
            const guestInterface = document.getElementById('guestInterface');
            const userInterface = document.getElementById('userInterface');
            const adminActions = document.getElementById('adminActions');
            
            if (token && userInfo) {
                const user = JSON.parse(userInfo);
                
                // 显示用户信息
                document.getElementById('userName').textContent = user.nickname || '用户';
                document.getElementById('userPhone').textContent = user.phone;
                document.getElementById('analysisCount').textContent = user.total_analysis_count || 0;
                document.getElementById('constitutionType').textContent = user.constitution_type || '未知';
                
                // 显示用户界面
                userStatus.classList.add('show');
                guestInterface.style.display = 'none';
                userInterface.style.display = 'block';
                
                // 如果是管理员，显示管理员功能
                if (user.role === 'admin') {
                    adminActions.classList.add('show');
                    log('✨ 管理员权限已激活');
                } else {
                    log('👤 用户已登录: ' + user.nickname);
                }
            } else {
                // 显示游客界面
                userStatus.classList.remove('show');
                guestInterface.style.display = 'block';
                userInterface.style.display = 'none';
                adminActions.classList.remove('show');
                
                log('👤 当前为游客状态');
            }
        }
        
        // 退出登录
        function logout() {
            localStorage.removeItem('authToken');
            localStorage.removeItem('userInfo');
            updateUserInterface();
            log('🚪 已退出登录');
        }
        
        // 测试健康检查API
        async function checkHealth() {
            log('正在检查系统健康状态...');
            try {
                const response = await fetch('/api/health');
                const data = await response.json();
                log('✅ 健康检查成功:');
                log('服务状态: ' + data.status);
                log('数据库: ' + data.database);
                log('用户数: ' + data.stats.users);
                log('分析数: ' + data.stats.analyses);
                log('产品数: ' + data.stats.products);
            } catch (error) {
                log('❌ 健康检查失败: ' + error.message);
            }
        }
        
        // 测试舌诊分析API
        async function testAnalysis() {
            log('正在测试舌诊分析API...');
            try {
                const token = localStorage.getItem('authToken');
                const headers = { 'Content-Type': 'application/json' };
                if (token) {
                    headers['Authorization'] = `Bearer ${token}`;
                }
                
                const response = await fetch('/api/analysis/analyze', {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify({
                        imageData: 'data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD...'
                    })
                });
                const data = await response.json();
                
                if (data.success) {
                    log('✅ 舌诊分析成功:');
                    log('体质类型: ' + data.data.analysis.constitution);
                    log('舌质: ' + data.data.analysis.tongueColor);
                    log('舌苔: ' + data.data.analysis.coatingType);
                    log('置信度: ' + (data.data.analysis.confidence * 100).toFixed(1) + '%');
                    log('分析ID: ' + data.data.analysisId);
                } else {
                    log('❌ 舌诊分析失败: ' + data.message);
                }
            } catch (error) {
                log('❌ 舌诊分析失败: ' + error.message);
            }
        }
        
        // 测试产品API
        async function testProducts() {
            log('正在测试产品查询API...');
            try {
                const response = await fetch('/api/products');
                const data = await response.json();
                
                if (data.success) {
                    log('✅ 产品查询成功:');
                    log('产品总数: ' + data.total);
                    data.data.slice(0, 3).forEach(product => {
                        log(`- ${product.name}: ¥${product.price}`);
                    });
                } else {
                    log('❌ 产品查询失败: ' + data.message);
                }
            } catch (error) {
                log('❌ 产品查询失败: ' + error.message);
            }
        }
        
        // 测试需要认证的API
        async function testAuthenticatedAPI() {
            const token = localStorage.getItem('authToken');
            const userInfo = localStorage.getItem('userInfo');
            
            if (!token) {
                log('❌ 需要先登录才能测试认证API');
                return;
            }
            
            try {
                const user = JSON.parse(userInfo);
                log('正在测试获取用户分析历史...');
                
                const response = await fetch(`/api/analysis/history/${user.id}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                const data = await response.json();
                
                if (data.success) {
                    log('✅ 用户分析历史获取成功:');
                    log(`总记录数: ${data.total}`);
                    if (data.data.length > 0) {
                        data.data.slice(0, 3).forEach(analysis => {
                            log(`- ${analysis.created_at}: ${analysis.constitution_type} (${(analysis.confidence_score * 100).toFixed(1)}%)`);
                        });
                    } else {
                        log('暂无分析记录');
                    }
                } else {
                    log('❌ 获取分析历史失败: ' + data.message);
                }
            } catch (error) {
                log('❌ 认证API测试失败: ' + error.message);
            }
        }
        
        // 显示系统统计
        async function showStats() {
            log('正在获取系统统计数据...');
            try {
                const response = await fetch('/api/health');
                const data = await response.json();
                
                if (data.success) {
                    log('📈 系统统计:');
                    log(`运行时间: ${Math.floor(data.uptime / 60)} 分钟`);
                    log(`总用户数: ${data.stats.users}`);
                    log(`总分析数: ${data.stats.analyses}`);
                    log(`产品数量: ${data.stats.products}`);
                } else {
                    log('❌ 获取统计失败: ' + data.message);
                }
            } catch (error) {
                log('❌ 获取统计失败: ' + error.message);
            }
        }
        
        // 导出数据
        function exportData() {
            log('📋 数据导出功能开发中...');
            log('将支持导出用户数据、分析记录等');
        }

        // 页面加载完成后的初始化
        window.addEventListener('load', function() {
            console.log('📱 页面加载完成');
            updateUserInterface();
            checkLocalStorage();
            
            // 只有管理员在调试模式下才显示就绪消息
            const userInfo = localStorage.getItem('userInfo');
            if (userInfo) {
                const user = JSON.parse(userInfo);
                if (user.role === 'admin') {
                    log('🎉 中医舌诊智能助手已就绪');
                }
            }
        });
        
        // 监听存储变化
        window.addEventListener('storage', function(e) {
            if (e.key === 'authToken' || e.key === 'userInfo') {
                updateUserInterface();
            }
        });
    </script>
</body>
</html>
